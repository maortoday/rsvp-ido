<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>שחזור סיסמה</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #c9943a; --gold-light: #e8c06a;
      --navy: #1a2a4a; --navy-mid: #2d4270;
      --green: #2e7d32; --red: #c62828;
      --cream: #fdfaf4; --border: #e4e9f2;
    }
    body {
      font-family: 'Heebo', sans-serif; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #0e1a32 0%, #1a2a4a 100%);
      padding: 20px;
    }
    .card {
      background: var(--cream); border-radius: 24px;
      width: 100%; max-width: 400px;
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
      border: 1px solid rgba(201,148,58,.2); overflow: hidden;
    }
    .card-header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      padding: 28px 24px; text-align: center;
    }
    .header-icon {
      width: 60px; height: 60px; border-radius: 50%;
      background: linear-gradient(135deg, #fdf3dc, #fce8b0);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin: 0 auto 12px;
      box-shadow: 0 4px 16px rgba(201,148,58,.35);
    }
    .header-title {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 20px; font-weight: 900; color: var(--gold-light);
    }
    .header-sub { font-size: 12px; color: rgba(255,255,255,.5); margin-top: 4px; }

    .body { padding: 28px 24px; }
    .step { display: none; }
    .step.active { display: block; }

    .field-group { margin-bottom: 16px; }
    .field-label {
      font-size: 11px; font-weight: 700; color: #888;
      letter-spacing: .06em; margin-bottom: 5px; display: block;
    }
    .input {
      width: 100%; height: 48px;
      border: 1.8px solid var(--border); border-radius: 12px;
      padding: 0 14px; font-family: 'Heebo', sans-serif; font-size: 15px;
      background: white; color: #1e1e1e; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,148,58,.12); }
    .recovery-input { letter-spacing: 4px; font-family: monospace; font-size: 18px; font-weight: 700; text-align: center; direction: ltr; }
    .input-hint { font-size: 11px; color: #aaa; margin-top: 4px; }

    .btn-primary {
      width: 100%; height: 50px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, var(--gold) 0%, #a07020 100%);
      color: white; font-family: 'Heebo', sans-serif;
      font-size: 16px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 16px rgba(201,148,58,.35);
      transition: opacity .15s, transform .1s; margin-top: 4px;
    }
    .btn-primary:hover { opacity: .92; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .error-msg { font-size: 12.5px; color: var(--red); text-align: center; min-height: 20px; margin: 6px 0 2px; }

    .success-screen { text-align: center; padding: 16px 0; }
    .success-icon { font-size: 52px; margin-bottom: 16px; }
    .success-title {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 20px; font-weight: 900; color: var(--navy); margin-bottom: 8px;
    }
    .success-msg { font-size: 13px; color: #666; line-height: 1.7; margin-bottom: 20px; }

    .footer { padding: 14px 24px; border-top: 1px solid var(--border); text-align: center; font-size: 12.5px; color: #999; }
    .footer a { color: var(--navy-mid); font-weight: 600; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="header-icon">🔑</div>
    <div class="header-title">שחזור סיסמה</div>
    <div class="header-sub">השתמשו בקוד השחזור שקיבלתם בהרשמה</div>
  </div>

  <div class="body">

    <!-- Step 1: email + recovery code + new password -->
    <div class="step active" id="step1">
      <div class="field-group">
        <label class="field-label">כתובת מייל</label>
        <input class="input" type="email" id="f-email" placeholder="you@example.com" dir="ltr" />
      </div>
      <div class="field-group">
        <label class="field-label">קוד שחזור</label>
        <input class="input recovery-input" type="text" id="f-code" placeholder="A1B2C3D4E5F6"
          maxlength="12" oninput="this.value = this.value.toUpperCase()" />
        <div class="input-hint">12 תווים — הקוד שהוצג לכם בעת ההרשמה</div>
      </div>
      <div class="field-group">
        <label class="field-label">סיסמה חדשה</label>
        <input class="input" type="password" id="f-pass" placeholder="לפחות 6 תווים" />
      </div>
      <div class="field-group">
        <label class="field-label">אימות סיסמה חדשה</label>
        <input class="input" type="password" id="f-pass2" placeholder="חזרו על הסיסמה" />
      </div>
      <div class="error-msg" id="f-error"></div>
      <button class="btn-primary" id="f-btn" onclick="doReset()">אפס סיסמה</button>
    </div>

    <!-- Step 2: success -->
    <div class="step" id="step2">
      <div class="success-screen">
        <div class="success-icon">✅</div>
        <div class="success-title">הסיסמה עודכנה!</div>
        <div class="success-msg">הסיסמה שלכם שונתה בהצלחה.<br/>תוכלו להתחבר כעת עם הסיסמה החדשה.</div>
        <button class="btn-primary" onclick="window.location.href='/register.html'">כניסה למערכת</button>
      </div>
    </div>

  </div>

  <div class="footer"><a href="/register.html">← חזרה לדף הכניסה</a></div>
</div>

<script>
  const API = window.location.hostname === 'localhost' ? 'http://localhost:5050/api' : '/api';

  async function doReset() {
    const btn   = document.getElementById('f-btn');
    const err   = document.getElementById('f-error');
    const email = document.getElementById('f-email').value.trim();
    const code  = document.getElementById('f-code').value.trim().toUpperCase();
    const pass  = document.getElementById('f-pass').value;
    const pass2 = document.getElementById('f-pass2').value;

    err.textContent = '';
    if (pass !== pass2) { err.textContent = 'הסיסמאות אינן תואמות'; return; }
    if (code.length !== 12) { err.textContent = 'קוד השחזור חייב להיות 12 תווים'; return; }

    btn.disabled = true; btn.textContent = 'מעדכן...';
    try {
      const res = await fetch(`${API}/auth/reset`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, recoveryCode: code, newPassword: pass })
      });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error || 'שגיאה באיפוס הסיסמה'; return; }
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step2').classList.add('active');
    } catch {
      err.textContent = 'שגיאת רשת, נסו שוב';
    } finally {
      btn.disabled = false; btn.textContent = 'אפס סיסמה';
    }
  }
</script>
</body>
</html>
